; Gateway's four long-running programs, once entrypoint.sh's one-shot
; bootstrap (headscale up + `lab-connect init --non-interactive`) has
; completed. headscale keeps running here under supervisord's own
; management — entrypoint.sh's earlier `headscale serve` was its own
; foreground process, stopped before exec'ing into supervisord, not a
; second concurrent instance.

[unix_http_server]
file=/run/supervisor.sock

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:headscale]
command=/usr/local/bin/headscale serve -c /etc/headscale/config.yaml
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/headscale.log
stderr_logfile=/var/log/supervisor/headscale.log

[program:admin-ui]
command=busybox-extras httpd -f -p 8092 -h /srv/headscale-admin
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/admin-ui.log
stderr_logfile=/var/log/supervisor/admin-ui.log

[program:lab-connect-runner]
command=/usr/local/bin/lab-connect runner
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/lab-connect-runner.log
stderr_logfile=/var/log/supervisor/lab-connect-runner.log

[program:lab-connect-mcp]
command=/usr/local/bin/lab-connect-mcp -addr :8091
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/lab-connect-mcp.log
stderr_logfile=/var/log/supervisor/lab-connect-mcp.log
