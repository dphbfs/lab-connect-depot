; Gateway's four long-running programs, once entrypoint.sh's one-shot
; bootstrap (headscale up + `lab-connect init --non-interactive`) has
; completed. headscale keeps running here under supervisord's own
; management — entrypoint.sh's earlier `headscale serve` was its own
; foreground process, stopped before exec'ing into supervisord, not a
; second concurrent instance.
;
; lab-connect-runner has to be started here, not by `lab-connect init`
; itself: init's service.Install/Start call (which would otherwise
; daemonize the Runner under its own private supervisord) only runs on
; the interactive TUI path (internal/tui/wizard.go's startRunnerService,
; called from tui.RunInit) — the --non-interactive path entrypoint.sh
; uses calls wizard.Init directly and returns without ever starting a
; background Runner. So this program is the only thing that keeps the
; Gateway registered on the overlay network after `init` exits.

[unix_http_server]
file=/run/supervisor.sock

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:headscale]
command=/usr/local/bin/headscale serve -c /etc/headscale/config.yaml
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/headscale.log
stderr_logfile=/var/log/supervisor/headscale.log

[program:admin-ui]
command=busybox-extras httpd -f -p 8092 -h /srv/headscale-admin
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/admin-ui.log
stderr_logfile=/var/log/supervisor/admin-ui.log

[program:lab-connect-runner]
command=/usr/local/bin/lab-connect runner
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/lab-connect-runner.log
stderr_logfile=/var/log/supervisor/lab-connect-runner.log

[program:lab-connect-mcp]
command=/usr/local/bin/lab-connect-mcp -addr :8091
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/lab-connect-mcp.log
stderr_logfile=/var/log/supervisor/lab-connect-mcp.log
